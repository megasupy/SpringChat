# Deploys main/master to your VM over SSH after a successful Maven build.
#
# GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#   SSH_HOST          e.g. 4.3.2.1 or your VM public DNS
#   SSH_USER          e.g. azureuser
#   SSH_PRIVATE_KEY   full private key (-----BEGIN ... OPENSSH PRIVATE KEY-----)
#
# One-time on the server:
#   1. sudo mkdir -p /home/azureuser/SpringChat
#   2. sudo cp deploy/springchat.service /etc/systemd/system/springchat.service   (adjust paths if needed)
#   3. sudo nano /etc/springchat.env   (see deploy/springchat.env.example)
#   4. sudo chmod 600 /etc/springchat.env
#   5. sudo systemctl daemon-reload && sudo systemctl enable springchat
#   6. Allow your deploy user to restart the unit without a password, e.g.:
#        sudo visudo -f /etc/sudoers.d/springchat-deploy
#        azureuser ALL=(ALL) NOPASSWD: /bin/systemctl restart springchat, /bin/systemctl status springchat
#
# Edit the REMOTE_JAR path below if your home directory or layout differs.

name: Build and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REMOTE_JAR: /home/azureuser/SpringChat/springchat.jar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload JAR and restart service
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          test -n "${SSH_PRIVATE_KEY}" && test -n "${SSH_HOST}" && test -n "${SSH_USER}" || {
            echo "Missing SSH_HOST, SSH_USER, or SSH_PRIVATE_KEY repository secrets."
            exit 1
          }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519,rsa "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            target/springchat.jar "${SSH_USER}@${SSH_HOST}:${REMOTE_JAR}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "sudo systemctl restart springchat"
