# Build runs ON THE VM (Maven), not on GitHub. This job only SSHs in and runs git + mvn + restart.
#
# Prerequisites on the server:
#   - Git clone of this repo at DEPLOY_DIR (see job env below)
#   - git remote "origin" = this GitHub repo (HTTPS or SSH)
#   - JDK 21 + Maven on PATH for the SSH user (e.g. sudo apt install openjdk-21-jdk maven)
#   - systemd service "springchat" + /etc/springchat.env (see deploy/springchat.service)
#   - sudo NOPASSWD for: systemctl restart springchat (see comments in deploy/springchat.service)
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST        VM hostname or IP
#   SSH_USER        e.g. azureuser
#   SSH_PRIVATE_KEY Private key so Actions can SSH *into your VM* (pair with that user’s authorized_keys). Not a GitHub “deploy key.”
#
# Public repo: git fetch/pull via HTTPS needs no GitHub credentials on the server.
# Private repo: use a deploy key or HTTPS token so the server can fetch.

name: Deploy (build on server)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Must match clone path on the VM; edit if yours differs.
      DEPLOY_DIR: /home/azureuser/SpringChat
    steps:
      - name: Pull, build on VM, restart springchat
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" && test -n "${SSH_HOST}" && test -n "${SSH_USER}" || {
            echo "Missing SSH_HOST, SSH_USER, or SSH_PRIVATE_KEY repository secrets."
            exit 1
          }
          BRANCH="${{ github.ref_name }}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ci_vm_key
          chmod 600 ~/.ssh/ci_vm_key
          ssh-keyscan -t ed25519,rsa "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/ci_vm_key -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -lc \"set -euo pipefail; cd ${DEPLOY_DIR}; git fetch origin; git checkout ${BRANCH}; git pull --ff-only origin ${BRANCH}; mvn -B -DskipTests package; sudo systemctl restart springchat\""
