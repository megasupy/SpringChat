<!doctype html>
<html>
  <head>
    <title>SpringChat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  </head>
  <body>
    <main class="container"> 
      <header>
        <h1>Log In</h1>
      </header>

      <form hx-post="/html/auth/login" hx-target="#login-result">
        <input name="username" placeholder="Type Username">
        <input name="password_unhashed" placeholder="Type Password">
        <button type="submit">Log in</button>
      </form>

      <div id="login-result"></div>

      <a href="/" role="button" class="secondary">Back Home</a>  
    </main>
  </body>
</html>
