<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"> 
  <head>
    <title>SpringChat</title>
    <th:block th:replace="~{fragments/defaulthead :: defaulthead}"></th:block>
  </head>
  <body>
    <main class="container"> 
      <nav>
        <ul>
          <li><a href="/" class="secondary"><strong>SpringChat</strong></a></li>
        </ul>
        <ul>

          <li th:unless="${loggedin}">
            <a href="/login" role="button">Log In</a>
          </li>

          <li th:unless="${loggedin}">
            <a href="/signup" role="button">Sign Up</a>
          </li>
          <li th:if="${loggedin}">
            <a href="/chat" role="button">Chat</a>
          </li>
          <li th:if="${loggedin}">
            <a href="#" role="button" class="contrast" hx-post="/logout" hx-trigger="click">Log Out</a>
          </li>
        </ul>
      </nav>
      <hr>
      <!-- do main with style container for picocss-->
      <header>
        <h1>
          Welcome to SpringChat
        </h1>
        <h3><em>A chat app created with Spring Boot, HTMX, and PicoCSS</em></h3>
      </header>

      <!-- Use model attribute ${loggedin}, not ${param.loggedin} (that's a URL ?param thing). -->
    </main>
  </body>
</html>
