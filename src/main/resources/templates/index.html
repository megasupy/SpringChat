<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"> 
  <head>
    <title>SpringChat</title>
    <th:block th:replace="~{fragments/defaulthead :: defaulthead}"></th:block>
  </head>
  <body>
    <main class="container"> 
      <!-- do main with style container for picocss-->
      <header>
        <h1>
          Welcome to SpringChat
        </h1>
        <h3><em>A chat app created with Spring Boot, HTMX, and PicoCSS</em></h3>
      </header>

      <section>
        <div class="grid">
          <a href="/login" role="button">Log In</a>
          <a href="/signup" role="button">Sign Up</a>
        </div>
      </section>

      <header>
        <h3>Messages</h3>
      </header>
      <article>
        <div id="messages" hx-get="/html/message" hx-trigger="load" hx-target="#messages"></div>
      </article>
    </main>
  </body>
</html>
