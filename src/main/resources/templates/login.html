<!doctype html>
<html>
  <head>
    <title>SpringChat</title>
    <html lang="en" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <meta name="_csrf" th:content="${_csrf.token}" content="(see source: _csrf.token when server-rendered)" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" content="(see source: _csrf.headerName when server-rendered)" />
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
      document.body.addEventListener('htmx:configRequest', function (event) {
        var t = document.querySelector('meta[name=_csrf]');
        var h = document.querySelector('meta[name=_csrf_header]');
        if (t && h && t.content) {
          event.detail.headers[h.content] = t.content;
        }
      });
    </script>
  </head>
  <body>
    <main class="container"> 
      <header>
        <h1>Log In</h1>
      </header>

      <form hx-post="/public/login" hx-target="#login-result">
        <input name="username" placeholder="Type Username">
        <input name="password" placeholder="Type Password">
        <button type="submit">Log in</button>
      </form>

      <div id="login-result"></div>

      <a href="/" role="button" class="secondary">Back Home</a>  
    </main>
  </body>
</html>
