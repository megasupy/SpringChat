<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"> 
  <head>
    <title>SpringChat</title>
    <th:block th:replace="~{fragments/defaulthead :: defaulthead}"></th:block>
  </head>
  <body>
    <main class="container"> 
      <header>
        <h1>Sign Up</h1>
      </header>

      <form hx-post="/public/html/signup" hx-target="#signup-result">
        <input name="username" placeholder="Type Username">
        <input name="password_unhashed" type="password" placeholder="Type Password">
        <button type="submit">Sign Up</button>
      </form>

      <div id="signup-result"></div>
      <a href="/" role="button" class="secondary">Back Home</a>  
    </main>
  </body>
</html>
